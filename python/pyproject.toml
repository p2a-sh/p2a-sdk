[project]
name = "p2a-sdk"
version = "0.1.1"
description = "SDK for p2a agents that run your own code"
readme = "README.md"
authors = [{ name = "p2a", email = "info@p2a.sh" }]
keywords = ["p2a", "agents", "mcp", "sdk"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://p2a.sh"
Repository = "https://github.com/p2a-sh/p2a-sdk"
Issues = "https://github.com/p2a-sh/p2a-sdk/issues"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p2a_sdk"]

[tool.hatch.build.targets.sdist]
ignore-vcs = true
only-include = ["src", "pyproject.toml", "uv.lock", "README.md", "LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
